<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brinderly Prototype</title>
<meta name="description" content="Brinderly connects retired professionals with museums, schools, students and young companies. Clickable prototype by Briage.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B3D66'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#FBFAF6; --ink:#1B2733; --muted:#5A6672; --line:#E3E0D6;
  --green:#0B3D66; --green-2:#0F7C80; --green-soft:#E3EEF5;
  --terra:#B35C00; --terra-soft:#FCEBCB; --terra-ink:#7A4300;
  --purple:#0F7C80; --purple-soft:#DDF0F0; --blue:#0F7C80;
  --gold:#F2B440; --danger:#B4412F; --danger-soft:#F8E1DC;
  --shadow:0 1px 2px rgba(30,38,33,.06),0 10px 28px rgba(30,38,33,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.ic{flex:none;vertical-align:middle}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(246,244,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);height:59px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:700;font-size:22px;color:var(--green);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:19px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin-left:auto}
.seg a{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.seg a:hover{color:var(--ink)}
.seg a.on{background:var(--green);color:#fff}
.reset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.reset:hover{color:var(--ink)}
@media (max-width:899px){.seg a.only-wide{display:none}}
@media (max-width:620px){.topbar{padding:10px 12px;gap:8px}.brand-text{display:none}.seg a{padding:7px 10px;font-size:13px}.reset span{display:none}}

/* ---------- stage & devices ---------- */
.stage{display:flex;justify-content:center;gap:48px;padding:24px 16px 32px;align-items:flex-start}
.device{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:520px}
.device-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.device-label .dot{width:9px;height:9px;border-radius:50%}
.phone{position:relative;width:100%;background:var(--surface-2);border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 130px);min-height:560px;display:flex;flex-direction:column}
.split .device{max-width:400px}
.split .phone{height:min(800px,calc(100vh - 125px));border:10px solid #1E2621;border-radius:46px}
@media (max-width:620px){
  .stage{padding:0}
  .device{max-width:none}
  .device-label{display:none}
  .phone{border-radius:0;border:none;box-shadow:none;height:calc(100vh - 59px);height:calc(100dvh - 59px);min-height:0}
}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.appbar{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:none}
.ab-text{flex:1;min-width:0}
.ab-title{font-weight:700;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.content{flex:1;overflow-y:auto;padding:16px 16px 24px;scroll-behavior:smooth}
.footer-bar{padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.bottomnav{display:flex;border-top:1px solid var(--line);background:var(--surface);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;border:none;background:none;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.bottomnav button.on{color:var(--green)}
.nav-badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--terra);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* ---------- elements ---------- */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;letter-spacing:.02em}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:10px}.gap-s{gap:6px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-h{font-family:Inter,sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.count{background:var(--green-soft);color:var(--green);border-radius:999px;padding:1px 8px;font-size:12px;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,38,33,.04)}
button.card{display:block;width:100%;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
button.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tc-title{font-weight:700;font-size:17px;line-height:1.3;margin:10px 0 8px}
.tc-title.big{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-top:0}
.org{font-weight:600;font-size:14px;line-height:1.2}
.task-card.is-new{border-color:var(--terra);box-shadow:0 0 0 4px var(--terra-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill-green{background:var(--green-soft);color:var(--green)}
.pill-terra{background:var(--terra-soft);color:var(--terra-ink)}
.pill-grey{background:#EEEAE2;color:var(--muted)}
.pill-red{background:var(--danger-soft);color:var(--danger)}
.pill-new{background:var(--purple-soft);color:var(--purple)}
.badge{background:var(--terra);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink)}
.chip.hit{background:var(--green-soft);border-color:#B9D2E3;color:var(--green);font-weight:600}
.match{color:var(--green);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.responded{color:var(--green);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-weight:600}
.pending-cv{display:inline-flex;align-items:center;gap:4px;color:var(--terra-ink);font-weight:600}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.desc{margin:0 0 12px;color:#3A433D;white-space:pre-line}
.msg{margin:12px 0 8px;padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:15px;color:#333C36;border-left:3px solid var(--green-soft)}
.name{font-weight:700;font-size:16px;line-height:1.25}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;transition:filter .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-light{background:#fff;color:var(--green)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn-ghost.danger{color:var(--danger)}
.btn.block{width:100%;padding:15px;font-size:16px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1;padding:10px 8px;font-size:14px}

.hero-card{border-radius:22px;padding:22px 20px;color:#fff;margin-bottom:6px;position:relative;overflow:hidden}
.hero-card.creator{background:linear-gradient(135deg,#0B3D66,#0F6E78)}
.hero-card.pro{background:linear-gradient(135deg,#9A4F00,#B86A10)}
.hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card h2{font-size:23px;line-height:1.2;margin:4px 0 8px}
.hero-card p{margin:0 0 16px;opacity:.9;font-size:15px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}

.demo-fill{width:100%;border:1.5px dashed var(--terra);background:var(--terra-soft);color:var(--terra-ink);font-weight:700;font-size:15px;border-radius:14px;padding:12px;display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:16px;cursor:pointer;transition:filter .15s}
.demo-fill:hover{filter:brightness(.97)}

/* forms */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,textarea,select{width:100%;font:16px/1.4 Inter,sans-serif;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.typing{border-color:var(--terra)!important;box-shadow:0 0 0 3px var(--terra-soft)!important}
.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px var(--danger-soft)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg-in{display:flex;gap:6px}
.seg-in button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.seg-in button.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.upload{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.upload.done{border-style:solid;border-color:#B9D2E3;background:var(--green-soft);color:var(--green)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 8px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green);flex:none}

/* steps */
.steps{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.step i{display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:6px;transition:background .4s}
.step.done{color:var(--green)}
.step.done i{background:var(--green)}

.applicant.declined{opacity:.55}
.applicant.accepted,.applicant.completed{border-color:#8FB4CF;box-shadow:0 0 0 3px var(--green-soft)}
.arrive{animation:arrive .6s ease}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.waiting{text-align:center;padding:26px 16px;color:var(--muted)}
.pulse{width:54px;height:54px;border-radius:50%;background:var(--green-soft);margin:0 auto 12px;display:grid;place-items:center;color:var(--green);position:relative}
.pulse::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);animation:ring 1.6s infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.8);opacity:0}}
.matched{background:linear-gradient(135deg,#E3EEF5,#F3F7FA);border-color:#B9D2E3}
.matched h3{font-size:19px;margin:0 0 4px}
.review-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:10px}
.status-card{border-radius:14px;padding:14px;font-size:14px}
.status-card.pending{background:var(--surface-2);border:1px solid var(--line)}
.status-card.accepted,.status-card.completed{background:var(--green-soft);color:var(--green)}
.status-card.declined{background:#EEEAE2;color:var(--muted)}
.status-card b{display:block;font-size:15px;margin-bottom:2px}

.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kv div{font-weight:600;font-size:14px}

/* profile */
.profile-head{text-align:center;padding:6px 0 4px}
.profile-head .av{margin-bottom:10px}
.profile-head h3{font-size:23px}
.profile-head p{margin:2px 0 8px;color:var(--muted)}
.stats{display:flex;gap:8px;margin:14px 0}
.stats>div{flex:1;background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}
.stats small{color:var(--muted);font-size:12px}
.cv-box{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.cv-box.ok{background:var(--green-soft);color:var(--green)}
.cv-box.wait{background:var(--terra-soft);color:var(--terra-ink)}
.cv-box b{display:block}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:none}
.rev p{margin:4px 0 0;font-size:14px;color:#3A433D}

/* toasts & modals */
.toasts{position:absolute;top:12px;left:12px;right:12px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-14px);opacity:0;transition:transform .3s,opacity .3s}
.toast.in{transform:none;opacity:1}
.toast.ok{background:var(--green)}
.toast.warn{background:var(--danger)}
.modal-host{position:absolute;inset:0;z-index:30}
.modal-host:empty{display:none}
.modal-back{position:absolute;inset:0;background:rgba(20,26,22,.45);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;animation:up .28s ease}
.sheet-body{overflow-y:auto;padding:22px 18px 12px}
.sheet-foot{padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
.sheet-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;z-index:2}
.star-pick{display:flex;gap:6px;justify-content:center;margin:14px 0 18px}
.star-pick button{border:none;background:none;padding:2px;cursor:pointer}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* landing */
.landing{max-width:980px;margin:0 auto;padding:48px 20px 60px}
.land-hero{text-align:center;max-width:680px;margin:0 auto 36px}
.land-hero .eyebrow{color:var(--terra);opacity:1}
.land-hero h1{font-size:clamp(38px,6vw,62px);line-height:1.04;margin:12px 0 16px;color:var(--green)}
.land-hero p{font-size:18px;color:#46504A;margin:0}
.land-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.land-card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.land-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.land-card::before{content:"";position:absolute;left:0;top:0;right:0;height:6px}
.land-card.pro::before{background:var(--terra)}
.land-card.creator::before{background:var(--green)}
.lc-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:16px}
.pro .lc-ic{background:var(--terra-soft);color:var(--terra-ink)}
.creator .lc-ic{background:var(--green-soft);color:var(--green)}
.land-card h3{font-size:24px;margin-bottom:6px}
.land-card p{margin:0 0 18px;color:var(--muted)}
.lc-go{font-weight:700}
.pro .lc-go{color:var(--terra-ink)}
.creator .lc-go{color:var(--green)}
.split-cta{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto 0;width:max-content;padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px}
.values div{border-top:2px solid var(--line);padding-top:14px}
.values b{font-family:Fraunces,serif;font-size:19px;display:block;margin-bottom:4px}
.values p{margin:0;color:var(--muted);font-size:15px}
.land-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
@media (max-width:899px){.split-cta{display:none}}
@media (max-width:680px){.land-cards,.values{grid-template-columns:1fr}.landing{padding-top:32px}}

/* ---------- accessibility: larger type for retirees ---------- */
.device[data-panel="pro"] .content{font-size:18px}
.device[data-panel="pro"] .ab-title{font-size:19px}
.device[data-panel="pro"] .ab-sub,.device[data-panel="pro"] .small{font-size:15.5px}
.device[data-panel="pro"] .tc-title{font-size:20px}
.device[data-panel="pro"] .tc-title.big{font-size:26px}
.device[data-panel="pro"] .org{font-size:16px}
.device[data-panel="pro"] .chip{font-size:15px;padding:5px 12px}
.device[data-panel="pro"] .desc,.device[data-panel="pro"] .msg{font-size:18px}
.device[data-panel="pro"] .fld>span{font-size:16px}
.device[data-panel="pro"] input,.device[data-panel="pro"] textarea{font-size:18px}
.device[data-panel="pro"] .btn{font-size:17px}
.device[data-panel="pro"] .btn.block{font-size:19px;padding:17px}
.device[data-panel="pro"] .bottomnav button{font-size:14px}
.device[data-panel="pro"] .filters button{font-size:16px;padding:9px 16px}
.device[data-panel="pro"] .status-card{font-size:16px}
.device[data-panel="pro"] .status-card b{font-size:17px}
.help-btn{display:inline-flex;align-items:center;gap:6px;flex:none;border:none;border-radius:999px;background:var(--gold);color:#0B3D66;font-weight:700;font-size:15px;padding:9px 14px;cursor:pointer}
.help-btn:hover{filter:brightness(.96)}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="brand-mark">B</span><span class="brand-text">Brinderly</span></a>
  <nav class="seg" aria-label="Views">
    <a href="#" data-mode="landing">Home</a>
    <a href="#creator" data-mode="creator">Task creator</a>
    <a href="#split" data-mode="split" class="only-wide">Both</a>
    <a href="#pro" data-mode="pro">Professional</a>
  </nav>
  <button class="reset" data-act="reset" title="Reset demo data"></button>
</header>
<main id="stage" class="stage"></main>

<script>
/* =========================================================
   Brinderly — clickable prototype (no backend).
   Data lives in localStorage, so two windows of the same
   browser stay in sync (e.g. creator + professional).
   ========================================================= */
const KEY = 'brinderly-demo-v2';
const CATS = ['Culture','Education','Students','Business'];
const ME_ORG = {name:'Marco Rossi', type:'History student · Milan', initials:'MR', color:'#0F7C80'};

/* ---------- demo content (English, for the pitch) ---------- */
const DEMO_TASK = {

function ago(ts){ const s=(Date.now()-ts)/1000; if(s<45) return 'just now'; const m=s/60; if(m<60) return Math.round(m)+' min ago'; const h=m/60; if(h<24) return Math.round(h)+' h ago'; return Math.round(h/24)+' d ago'; }
function chip(icon, text, cls=''){ return `<span class="chip ${cls}">${icon?ic(icon,14):''}${esc(text)}</span>`; }
function metaChips(t){ return `<div class="chips">${chip('pin', t.mode==='Remote' ? 'Remote' : t.location)}${chip('clock', t.duration)}${chip('gift', t.reward)}</div>`; }

const FORM_VIEWS = ['create','respond','onboard'];
function visible(p){ return !!document.querySelector(`.device[data-panel="${p}"]`); }

function renderStage(){
  document.querySelectorAll('.seg a').forEach(a => a.classList.toggle('on', a.dataset.mode === MODE));
  $('.reset').innerHTML = `${ic('refresh',16)}<span>Reset demo</span>`;
  const st = $('#stage');
  st.className = 'stage' + (MODE === 'split' ? ' split' : '');
  if(MODE === 'landing'){ st.innerHTML = landing(); return; }
  const panels = MODE === 'split' ? ['creator','pro'] : [MODE];
  st.innerHTML = panels.map(p => `
    <section class="device" data-panel="${p}">
      <div class="device-label"><span class="dot" style="background:${p==='creator'?'var(--green)':'var(--terra)'}"></span>${p==='creator'?'Task creator · Marco, student':'Retired professional'}</div>
      <div class="phone"><div class="screen"></div><div class="modal-host"></div><div class="toasts"></div></div>
    </section>`).join('');
  panels.forEach(p => renderPanel(p));
}

function renderPanel(p, opts={}){
  const dev = document.querySelector(`.device[data-panel="${p}"]`); if(!dev) return;
  const scr = dev.querySelector('.screen');
  const view = (p === 'pro' && !S.proProfile) ? 'onboard' : UI[p].view;
  if(opts.passive && FORM_VIEWS.includes(view)) return;           // never wipe a form someone is typing in
  const old = scr.querySelector('.content');
  const keep = opts.passive && old ? old.scrollTop : 0;
  scr.innerHTML = p === 'creator' ? creatorScreen() : proScreen();
  if(p === 'pro'){ const ab = scr.querySelector('.appbar'); if(ab) ab.insertAdjacentHTML('beforeend', `<button class="help-btn" data-act="p-help" aria-label="Call for help">${ic('phone',16)} Help</button>`); }
  const c = scr.querySelector('.content');
  if(c){ c.style.scrollBehavior = 'auto'; c.scrollTop = keep; c.style.scrollBehavior = ''; }
  if(!opts.passive) dev.querySelector('.modal-host').innerHTML = UI[p].modal ? modalHTML(p) : '';
}

function commit(from){
  save();
  ['creator','pro'].forEach(p => { if(visible(p)) renderPanel(p, p === from ? {} : {passive:true}); });
}
function go(p, view, extra={}){ UI[p] = {...UI[p], view, modal:null, ...extra}; renderPanel(p); }

function toast(p, html, kind=''){
  const dev = document.querySelector(`.device[data-panel="${p}"]`); if(!dev) return;
  const host = dev.querySelector('.toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.innerHTML = html; host.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 350); }, 3800);
}

  const resps = [...t.responses].sort((a,b) => order[a.status]-order[b.status] || b.at-a.at);
  const acc = t.responses.find(r => r.status === 'accepted' || r.status === 'completed');
  return `<header class="appbar">${backBtn('c-home')}<div class="ab-text"><div class="ab-title">Your task</div><div class="ab-sub">Posted ${ago(t.createdAt)}</div></div>${statusPill(t.status)}</header>

/* ---------- forms ---------- */
async function typeInto(el, text){
  el.classList.add('typing');
  el.scrollIntoView({block:'nearest', behavior:'smooth'});
  const steps = Math.min(16, Math.max(4, Math.ceil(text.length / 6)));
  for(let i = 1; i <= steps; i++){ el.value = text.slice(0, Math.ceil(text.length * i / steps)); await sleep(20); }
  el.classList.remove('typing', 'invalid');
}
async function fillForm(form, data){
  if(!form || form.dataset.filling) return;
  form.dataset.filling = '1';
  for(const [k, v] of Object.entries(data)){
    if(!form.isConnected) break;
    const el = form.elements[k];
    if(el && el.tagName === 'SELECT'){ el.value = v; continue; }
    if(el){ await typeInto(el, String(v)); continue; }
    const g = form.querySelector(`.seg-in[data-group="${k}"]`);
    if(g) g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === v));
  }
  delete form.dataset.filling;
}
function readForm(form){
  const d = Object.fromEntries(new FormData(form));
  form.querySelectorAll('.seg-in').forEach(g => d[g.dataset.group] = g.querySelector('.on')?.dataset.val);
  return d;
}
function requireFields(form, names){
  let ok = true;
  names.forEach(n => { const el = form.elements[n]; if(!String(el.value).trim()){ el.classList.add('invalid'); ok = false; } });
  if(!ok) form.querySelector('.invalid')?.scrollIntoView({block:'center', behavior:'smooth'});
  return ok;
}
const panelForm = (panel, id) => document.querySelector(`.device[data-panel="${panel}"] #${id}`);
function setUploaded(panel){
  const b = document.querySelector(`.device[data-panel="${panel}"] .upload`);
  if(b){ b.classList.add('done'); b.innerHTML = `${ic('check')} <span>CV_Roberta_Conti.pdf</span>`; }
}

/* ---------- simulated applicants ---------- */
function scheduleApplicants(id){
  SIM_APPLICANTS.forEach(a => {
    timers.push(setTimeout(() => {
      const t = task(id);
      if(!t || t.status !== 'open' || t.responses.some(r => r.proId === a.pid)) return;
      const r = {id:'r' + (++S.seq), proId:a.pid, message: isThesisTask(t) ? a.thesis : a.generic, availability:a.availability, status:'pending', at:Date.now(), seen:false};
      t.responses.push(r);
      if(UI.creator.view === 'task' && UI.creator.taskId === id) r.seen = true;
      commit(null);
      const p = S.pros[a.pid];
      toast('creator', `${avatar(p.name, p.color, 26)}<span>New response from <b>${esc(p.name)}</b></span>`);
    }, a.delay));
  });
}

/* ---------- actions ---------- */
const A = {
  reset(){
    timers.forEach(clearTimeout); timers = [];
    S = seedState(); save(); resetUI(); renderStage();
  },
  'close-modal'(id, el, panel){ UI[panel].modal = null; renderPanel(panel); },

  /* creator */
  'c-home'(){ go('creator', 'home'); },
  'c-new'(){ go('creator', 'create'); },
  'c-open'(id){ go('creator', 'task', {taskId:id}); },
  'c-fill'(){ fillForm(panelForm('creator', 'c-form'), DEMO_TASK); },
  'c-publish'(){
    const f = panelForm('creator', 'c-form');
    if(f.dataset.filling) return;
    if(!requireFields(f, ['title','description'])){ toast('creator', 'Please add a title and a description', 'warn'); return; }
    const d = readForm(f);
    const t = {id:'t' + (++S.seq), mine:true, org:ME_ORG.name, orgType:ME_ORG.type, initials:ME_ORG.initials, color:ME_ORG.color,
      title:d.title.trim(), category:d.category, description:d.description.trim(),
      skills:(d.skills || '').split(',').map(s => s.trim()).filter(Boolean),
      mode:d.mode || 'In person', location:d.location.trim() || 'To be agreed', duration:d.duration.trim() || 'Flexible', reward:d.reward.trim() || 'To be agreed',
      createdAt:Date.now(), status:'open', responses:[]};
    S.tasks.unshift(t);
    UI.creator = {view:'task', taskId:t.id};
    commit('creator');
    toast('creator', `${ic('check')}<span>Task published · sent to 128 matching professionals</span>`, 'ok');
    if(S.proProfile) toast('pro', `${ic('bell')}<span>New task for you: <b>${esc(t.title)}</b></span>`);
    scheduleApplicants(t.id);
  },
  'c-profile'(id){ UI.creator.modal = {type:'profile', respId:id}; renderPanel('creator'); },
  'c-accept'(id){
    const [t, r] = findResp(id); if(!t || t.status !== 'open') return;
    r.status = 'accepted';
    t.responses.forEach(x => { if(x !== r && x.status === 'pending') x.status = 'declined'; });
    t.status = 'matched';
    UI.creator.modal = null;
    commit('creator');
    const p = S.pros[r.proId];
    toast('creator', `${ic('check')}<span>You matched with <b>${esc(p.name)}</b></span>`, 'ok');
    if(r.proId === 'giulia') toast('pro', `<span>🎉 <b>${esc(t.org)}</b> accepted your response!</span>`, 'ok');
    else if(myResp(t)) toast('pro', `<span>${esc(t.org)} chose another professional this time</span>`);
  },
  'c-decline'(id){
    const [t, r] = findResp(id); if(!r) return;
    r.status = 'declined'; UI.creator.modal = null;
    commit('creator');
    if(r.proId === 'giulia') toast('pro', `<span>${esc(t.org)} chose another professional this time</span>`);
  },
  'c-msg'(){ toast('creator', `${ic('chat')}<span>In-app chat is part of the full version</span>`); },
  'c-done'(id){ UI.creator.modal = {type:'review', taskId:id, stars:5}; renderPanel('creator'); },
  'rv-star'(id, el){ UI.creator.modal.stars = +id; starPickRender(el.closest('.sheet'), +id); },
  'rv-fill'(id, el){ const ta = el.closest('.sheet').querySelector('#rv-text'); typeInto(ta, DEMO_REVIEW); },
  'rv-submit'(id, el){
    const m = UI.creator.modal, t = task(m.taskId), r = t.responses.find(x => x.status === 'accepted'), p = S.pros[r.proId];
    const text = el.closest('.sheet').querySelector('#rv-text').value.trim() || 'Great collaboration, thank you!';
    t.review = {stars:m.stars, text};
    t.status = 'completed'; r.status = 'completed'; r.proSeen = false;
    p.reviews.unshift({by:ME_ORG.name, stars:m.stars, text, when:'Just now'});
    p.rating = p.reviewCount ? (p.rating * p.reviewCount + m.stars) / (p.reviewCount + 1) : m.stars;
    p.reviewCount += 1;
    UI.creator.modal = null;
    commit('creator');
    toast('creator', `${ic('check')}<span>Review published — thank you!</span>`, 'ok');
    if(r.proId === 'giulia') toast('pro', `<span>⭐ You received a new review from <b>${esc(t.org)}</b></span>`, 'ok');
  },

  /* professional */
  'p-feed'(){ go('pro', 'feed'); },

  'p-profile'(){ go('pro', 'profile'); },
  'p-help'(){ toast('pro', `${ic('phone')}<span>Calling Brinderly support… A real person will help you, in Italian or English.</span>`, 'ok'); },

  'p-open'(id){ go('pro', 'task', {taskId:id}); },
  'p-back-task'(){ go('pro', 'task'); },
  'p-respond'(id){ go('pro', 'respond', {taskId:id}); },
  'p-fill-resp'(){ fillForm(panelForm('pro', 'r-form'), DEMO_RESPONSE); },
  'p-send'(id){
    const f = panelForm('pro', 'r-form'); if(f.dataset.filling) return;
    if(!requireFields(f, ['message'])){ toast('pro', 'Please write a short message', 'warn'); return; }
    const d = readForm(f), t = task(id);
    if(!t || myResp(t)) return;
    t.responses.push({id:'r' + (++S.seq), proId:'giulia', message:d.message.trim(), availability:d.availability.trim() || 'Flexible', status:'pending', at:Date.now(), seen:false});
    if(t.mine && UI.creator.view === 'task' && UI.creator.taskId === id && visible('creator')) t.responses[t.responses.length-1].seen = true;
    UI.pro = {...UI.pro, view:'mine', modal:null};
    commit('pro');
    toast('pro', `${ic('check')}<span>Response sent to <b>${esc(t.org)}</b></span>`, 'ok');
    if(t.mine){ const g = S.pros.giulia; toast('creator', `${avatar(g.name, g.color, 26)}<span>New response from <b>${esc(g.name)}</b></span>`); }
  },
  'p-upload'(id, el, panel){ setUploaded(panel); },
  'p-fill-profile'(id, el, panel){ fillForm(panelForm('pro', 'p-form'), DEMO_PROFILE).then(() => setUploaded(panel)); },
  'p-create'(id, el, panel){
    const f = panelForm('pro', 'p-form'); if(f.dataset.filling) return;
    if(!requireFields(f, ['name','former'])){ toast('pro', 'Please add your name and former profession', 'warn'); return; }
    const d = readForm(f);
    S.pros.giulia = {id:'giulia', name:d.name.trim(), age:d.age.trim(), city:d.city.trim(), former:d.former.trim(), years:d.years.trim(),
      skills:(d.skills || '').split(',').map(s => s.trim()).filter(Boolean), bio:d.bio.trim(),
      verified:false, color:'#B35C00', rating:0, reviewCount:0, reviews:[]};
    S.proProfile = true;
    UI.pro = {view:'feed', filter:'All'};
    commit('pro');
    toast('pro', `${ic('check')}<span>Profile created! Our team is checking your CV…</span>`, 'ok');
    timers.push(setTimeout(() => {
      if(!S.pros.giulia) return;
      S.pros.giulia.verified = true; commit(null);
      toast('pro', `${ic('shield')}<span>Your CV has been verified ✓</span>`, 'ok');
    }, 3500));
  }
};

document.addEventListener('click', e => {
  const sb = e.target.closest('.seg-in button');
  if(sb){ sb.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sb)); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  fn(el.dataset.id, el, el.closest('[data-panel]')?.dataset.panel);
});
document.addEventListener('input', e => e.target.classList?.remove('invalid'));

/* ---------- sync between windows of the same browser ---------- */
function diffNotify(a, b){
  b.tasks.forEach(t => {
    const o = a.tasks.find(x => x.id === t.id);
    if(!o){ if(b.proProfile) toast('pro', `${ic('bell')}<span>New task for you: <b>${esc(t.title)}</b></span>`); return; }
    t.responses.forEach(r => {
      const or = o.responses.find(x => x.id === r.id), p = b.pros[r.proId];
      if(!or && t.mine && p) toast('creator', `${avatar(p.name, p.color, 26)}<span>New response from <b>${esc(p.name)}</b></span>`);
      if(or && or.status !== r.status && r.proId === 'giulia'){
        if(r.status === 'accepted') toast('pro', `<span>🎉 <b>${esc(t.org)}</b> accepted your response!</span>`, 'ok');
        if(r.status === 'completed') toast('pro', `<span>⭐ You received a new review from <b>${esc(t.org)}</b></span>`, 'ok');
      }
    });
  });
}
window.addEventListener('storage', e => {
  if(e.key !== KEY || !e.newValue) return;
  let next; try{ next = JSON.parse(e.newValue); }catch(_){ return; }
  const old = S; S = next;
  if(S.seq < old.seq){ resetUI(); renderStage(); return; }          // reset happened in another window
  diffNotify(old, S);
  if(UI.creator.taskId && !task(UI.creator.taskId)) UI.creator = {view:'home'};
  if(S.proProfile && UI.pro.view === 'onboard') UI.pro = {view:'feed', filter:'All'};
  ['creator','pro'].forEach(p => visible(p) && renderPanel(p, {passive:true}));
});

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace('#', '');
  MODE = ['creator','pro','split'].includes(h) ? h : 'landing';
  if(MODE === 'split' && innerWidth < 900) MODE = 'creator';
  if(UI.pro.view === 'onboard' && S.proProfile) UI.pro.view = 'feed';
  renderStage();
  scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
